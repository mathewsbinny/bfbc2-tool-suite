[package]
name = "bc2-navbuild"
description = "NavKit's path-data generator: its grid walks (neighbours, areas, walkable lines, route searches), pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bc2-formats.workspace = true
bc2-shader.workspace = true
# the level driver (inputs.rs, round NK6): the detailed sectors near a NeedsDetailedPathfinding object's collision
# (the suite's Havok index)
bc2-scene.workspace = true
sha1_smol.workspace = true
thiserror.workspace = true
rayon.workspace = true

# the sectors' build date and clock as the Python's time.localtime() gives them (inputs::local_clock, round NK6)
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
# graphedit: NavKit's apply edits on a path-data file (`navkit apply`: bc2-cli, the bindings and, round NK6, the
# editor's Build in process); Python's json and round() are this crate's own (pyjson, pymath), not bc2-pyrt
graphedit = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
