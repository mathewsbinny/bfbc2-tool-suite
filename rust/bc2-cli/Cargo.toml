[package]
name = "bc2-cli"
description = "The BFBC2 Tool Suite's command lines in Rust (round O1): one binary, bfbc2, with the tools as subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "bfbc2"
path = "src/main.rs"

[dependencies]
bc2-formats.workspace = true
bc2-harness.workspace = true
bc2-convert.workspace = true
regex.workspace = true
# round O4: NavKit's driver, prepare and tools (the collision index, the level scan and measures), the harness, texqa
bc2-scene.workspace = true
bc2-navbuild.workspace = true
sha1_smol.workspace = true

# round O2's tool groups (all on by default; a group alone builds with --no-default-features --features <group>)
[features]
default = ["menu", "crash", "nav", "navkit", "navtools", "harness", "texqa"]
menu = []
crash = []
nav = []
# round O4's groups: NavKit's driver and prepare (navkit.py, prepare_level.py, levelobjects, ladders, ordercheck,
# navcompare); NavKit's other tool command lines; the map and bot test harness; texqa
navkit = []
navtools = []
harness = []
texqa = []

# the local time (Python's datetime.now()), the ANSI code page and the console test Python's stdio makes
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
