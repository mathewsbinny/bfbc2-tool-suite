[package]
name = "bc2-cli"
description = "The BFBC2 Tool Suite's command lines in Rust (round O1): one binary, bfbc2, with the tools as subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "bfbc2"
path = "src/main.rs"

[dependencies]
bc2-formats.workspace = true
regex.workspace = true

# the local time (Python's datetime.now()), the ANSI code page and the console test Python's stdio makes
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
