[package]
name = "bc2-cli"
description = "The BFBC2 Tool Suite's command lines in Rust: one binary, bfbc2, with the tools as subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "bfbc2"
path = "src/main.rs"

[dependencies]
bc2-formats.workspace = true
bc2-tools.workspace = true
bc2-gamefs.workspace = true
# round OR1: the game-copy installer (`bfbc2 install`)
bc2-install.workspace = true
serde_json.workspace = true
bc2-harness.workspace = true
# the mesh index and its cache (gameindex; shared with meshview.py through bc2_native and the editor)
bc2-convert.workspace = true
regex.workspace = true
bc2-pyrt.workspace = true
bc2-menu.workspace = true
# round O4: NavKit's driver, prepare and tools (the collision index, the level scan and measures), the harness, texqa
bc2-scene.workspace = true
# NavKit's apply edits (`navkit apply`) are bc2-navbuild's graphedit feature
bc2-navbuild = { workspace = true, features = ["graphedit"] }
# round O3: the archives of pruned logs (deflate and CRC-32, as zipfile writes them)
flate2.workspace = true
# round O3's cull group: culltree.py's model (bc2_levelwrite::culltool)
bc2-levelwrite = { workspace = true, optional = true }
# round O3: stockmp install's readings of the build and the game folder
bc2-stockmp = { workspace = true, optional = true }
# round O3: dbxcatalogue's cache signature (SHA-1, as hashlib)
sha1_smol.workspace = true

# the tool groups (rounds O2, O3; all on by default; a group alone builds with --no-default-features --features <group>)
[features]
default = ["menu", "crash", "nav", "caches", "stockmp", "graft", "audio", "bf1943", "meshview", "cull", "navkit", "navtools", "harness", "texqa", "shader", "readers", "import"]
menu = []
crash = []
nav = []
caches = []
# round O5: generate / validate place and check the bots on NavKit's path-data model (navkit's ordercheck)
stockmp = ["dep:bc2-stockmp", "navkit"]
graft = []
audio = []
bf1943 = []
meshview = []
cull = ["dep:bc2-levelwrite", "caches"]
# round O4's groups: NavKit's driver and prepare (navkit.py, prepare_level.py, levelobjects, ladders, ordercheck,
# navcompare); NavKit's other tool command lines; the map and bot test harness; texqa
navkit = []
navtools = []
harness = []
texqa = []
# round O5: the shader tools' command lines (shaderdb, renderqa, xdiff)
shader = []
# round O5: the console readers' command lines (apt, stfs, xiso); the BF1943 importer's (bf1943import)
readers = []
import = []

# the local time (Python's datetime.now()), the ANSI code page and the console test Python's stdio makes
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# the application icon (round I1: build.rs)
[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
