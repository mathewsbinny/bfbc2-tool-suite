[package]
name = "bc2-install"
description = "The game-copy installer on the install ledger: Project OPFOR's WW2 install and the map export's install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bc2-formats.workspace = true
bc2-gamefs.workspace = true
# the install plan (OPFOR's decisions as data), the level records and staged.json
serde.workspace = true
serde_json.workspace = true
# the registration and ini rules (Python's re, the same patterns), the backup guard's marks
regex.workspace = true
# the staged files' digests and the fingerprint's walk on all cores
rayon.workspace = true
# the WW2 level build (round OR2, feature `levelbuild`): DbxEdit's and FbrbTool's commands in process, the emitter atlas's
# and mesh readers, the HUD icon movie, Python's number and string formats in the report, sha1 of the emitters
bc2-tools = { workspace = true, optional = true }
bc2-convert = { workspace = true, optional = true }
bc2-menu = { workspace = true, optional = true }
bc2-pyrt = { workspace = true, optional = true }
sha1_smol = { workspace = true, optional = true }
# the Onslaught import's error (round OR5, feature `onslaught`)
thiserror = { workspace = true, optional = true }
# the map export's install (round OR6, feature `mapedit`): the stage's check, the startup / overlay / awards patches
bc2-levelwrite = { workspace = true, optional = true }

[features]
# the WW2 level build (OPFOR's wake_install.build, round OR2): bc2_native's ww2build_* functions; bfbc2.exe's
# installer does not need it
levelbuild = ["dep:bc2-tools", "dep:bc2-convert", "dep:bc2-menu", "dep:bc2-pyrt", "dep:sha1_smol"]
# the console Onslaught import (OPFOR's console_onslaught.build / install, round OR5): bc2_native's onslaught_*
onslaught = ["dep:bc2-tools", "dep:bc2-pyrt", "dep:thiserror"]
# the map export's install (Project OPFOR's mapedit_install.py, round OR6): `bfbc2 install mapedit` and the map
# editor's Install dialog
mapedit = ["dep:bc2-levelwrite", "dep:bc2-pyrt"]

[lints]
workspace = true
