# The suite's Rust core (EDITOR_ARCHITECTURE.md 3.8): pure-Rust format libraries, and their Python bindings.
#
#   cargo test                                   every crate's unit, integration and doc tests
#   cargo clippy --all-targets -- -D warnings
#   cargo fmt --check
#   python build_native.py                       the Python module (bc2_native) into core\ (README.md)
#
# Crates: bc2-formats (the game's file formats, no Python types), bc2-scene (a level: entities, collision, terrain,
# water), bc2-py (PyO3 bindings, module bc2_native). Later crates (levelwrite, the editor application) join `members`
# and take their dependencies from [workspace.dependencies].

[workspace]
resolver = "3"
members = ["bc2-formats", "bc2-scene", "bc2-py", "bc2-convert", "bc2-navbuild", "bc2-shader", "bc2-stockmp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
repository = "https://github.com/mathewsbinny/bfbc2-tool-suite"

# Exact versions: a format reader's output must not change under a dependency update nobody chose.
[workspace.dependencies]
bc2-formats = { path = "bc2-formats" }
bc2-scene = { path = "bc2-scene" }
bc2-convert = { path = "bc2-convert" }
bc2-navbuild = { path = "bc2-navbuild" }
bc2-shader = { path = "bc2-shader" }
bc2-stockmp = { path = "bc2-stockmp" }
thiserror = "=2.0.21"
rayon = "=1.12.0"
# gzip of FBRB bundles: raw deflate (the gzip framing is read in bc2-formats, by the reference's rules) and CRC-32
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "abi3-py312"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
sha1_smol = "=1.0.1"
# the allocation counts of rust/BENCHMARKS.md (examples/dbx_mem.rs)
stats_alloc = "=0.1.10"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Pedantic, minus the lints that fight a binary-format reader: offsets and counts are cast between usize / u32 /
# i32 on purpose and every narrowing cast is checked where the value comes from the file.
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
# Robustness: input data must never panic the reader.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# The inflater optimised in test builds too: the bundle tests decompress megabytes many times over (round E3e).
[profile.dev.package.zlib-rs]
opt-level = 3
