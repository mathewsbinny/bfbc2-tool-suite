# The suite's Rust core (bfbc2-map-editor/EDITOR_ARCHITECTURE.md 3.8): pure-Rust format libraries, their Python
# bindings, the command-line binary and the map editor.
#
#   cargo test                                   every crate's unit, integration and doc tests (bc2-editor's,
#                                                bc2-levelwrite's and bc2-render's integration tests are one test
#                                                binary each: --test editor / levelwrite / render, a file's tests by
#                                                its module, e.g. cargo test -p bc2-editor --test editor g2::)
#   cargo clippy --all-targets -- -D warnings
#   cargo fmt --check
#   python build_native.py                       the Python module (bc2_native) into core\ (README.md)
#
# Crates (14): bc2-formats (the game's file formats, no Python types), bc2-scene (a level: entities, collision, terrain,
# water), bc2-py (PyO3 bindings, module bc2_native), bc2-convert (the console converters and the BF1943 import's ports:
# textures, meshes, Havok, audio, Granny, DBX; rounds E1d, R2, F2a), bc2-navbuild (NavKit's path-data generator, rounds
# E1d / R1), bc2-shader (the Xbox 360 shader translator and disassembler, round R3), bc2-stockmp (the stock-MP AI layer,
# round E4a), bc2-harness (the test harness and the crash reader, round E4f), bc2-editor (the map editor application,
# binary bfbc2-editor; an application, not part of bc2_native: bfbc2core.native.APPLICATIONS; bfbc2-map-editor/),
# bc2-levelwrite (the map project's operation log, its edits on a level partition and the export, binary mapexport;
# rounds E2, E3), bc2-render (the editor's game-accurate view: DICE's Direct3D 11 shaders, round R5), bc2-cli (the
# command-line binary bfbc2: the tools' command lines as subcommands, round O1), bc2-pyrt (what the Python command lines
# show of the Python runtime, for bc2-cli's ports, rounds O2 - O3), bc2-menu (the menu tools' library, rounds O2 - O3).
# Later crates join `members` and take their dependencies from [workspace.dependencies].

[workspace]
resolver = "3"
members = ["bc2-formats", "bc2-scene", "bc2-py", "bc2-convert", "bc2-navbuild", "bc2-shader", "bc2-stockmp", "bc2-harness", "bc2-editor", "bc2-levelwrite", "bc2-render", "bc2-cli", "bc2-pyrt", "bc2-menu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
repository = "https://github.com/mathewsbinny/bfbc2-tool-suite"

# Exact versions: a format reader's output must not change under a dependency update nobody chose.
[workspace.dependencies]
bc2-formats = { path = "bc2-formats" }
bc2-scene = { path = "bc2-scene" }
bc2-convert = { path = "bc2-convert" }
bc2-navbuild = { path = "bc2-navbuild" }
bc2-shader = { path = "bc2-shader" }
bc2-stockmp = { path = "bc2-stockmp" }
bc2-levelwrite = { path = "bc2-levelwrite" }
bc2-harness = { path = "bc2-harness" }
bc2-render = { path = "bc2-render" }
bc2-pyrt = { path = "bc2-pyrt" }
bc2-menu = { path = "bc2-menu" }
thiserror = "=2.0.21"
rayon = "=1.12.0"
# gzip of FBRB bundles: raw deflate (the gzip framing is read in bc2-formats, by the reference's rules) and CRC-32
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "abi3-py312"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
sha1_smol = "=1.0.1"
# the allocation counts of rust/BENCHMARKS.md (examples/dbx_mem.rs)
stats_alloc = "=0.1.10"
# the crash reader's and exeref's x86 decoding (bc2-harness, round E4f: capstone's text and operands rebuilt on it)
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
# the opfor.log readers' literal searches and line patterns (bc2-harness)
memchr = "=2.8.3"
aho-corasick = "=1.1.5"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
# The map editor application (bc2-editor, round G1): egui on wgpu through eframe, docked panels (egui_dock), the
# theme read from design/project/tokens.json (serde_json), headless rendering (pollster) and screenshots (png).
# egui_dock 0.21 targets egui 0.36, so egui stays on 0.36 until egui_dock follows 0.37. wgpu and egui-wgpu come
# through eframe's re-exports (eframe::egui_wgpu::wgpu): one version, the one eframe was built and tested with.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "wgpu", "persistence"] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
bytemuck = "=1.25.2"
pollster = "=1.0.1"
png = "=0.18.1"
# The export's pictures from the user's JPEG files (bc2-levelwrite's awards, round E3b; already in the lock through
# eframe's image decoders).
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"
# The game-accurate view (bc2-render, round R5): Direct3D 11 drawing DICE's own compiled shaders, the version wgpu's
# Direct3D 12 backend already brings in (one copy of the bindings in the build).
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D_Fxc", "Win32_Security"] }
# The command-line binary (bc2-cli, round O1): the local time, the ANSI code page and the console test Python's stdio
# makes, so its output and logs are the Python command lines' byte for byte (already in the lock through eframe).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }
# The application icon as a Windows resource in bfbc2.exe, bfbc2-editor.exe and mapexport.exe (round I1: the build
# scripts' rust/app_icon.rs; rc.exe of the Windows SDK, found by the crate; nothing on other targets).
embed-resource = "=3.0.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Pedantic, minus the lints that fight a binary-format reader: offsets and counts are cast between usize / u32 /
# i32 on purpose and every narrowing cast is checked where the value comes from the file.
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
# Robustness: input data must never panic the reader.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Debug and test builds keep line tables only (round QW1, audit AU2 S4: full debug info made each editor test binary
# a ~370 MB PDB, and the debug folder of a worktree 24 GB): a panic's backtrace still names every function, file and
# line; a debugger shows no local variables (set debug = "full" here for a session that needs them). The workspace's
# own crates at opt-level 1 (round TS1, audit AU3 TS-2): the whole-level tests spend their time in our code (the
# scene, the views, levelwrite), 1.2-5.8 times faster (rust/BENCHMARKS.md TS1); debug assertions and overflow checks
# stay on. Set opt-level = 0 here for a debugger session that steps line by line.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.bench]
inherits = "release"

# Dependencies optimised in debug and test builds (round TS1, audit AU3 TS-2): wgpu, egui, the image decoders, rayon
# and serde ran unoptimised under the editor's, levelwrite's and the renderer's tests. Built once per PC with the
# shared compile cache (README, "The Rust core"), else once per build folder; rust/BENCHMARKS.md (TS1) has the
# compile cost against the test-time gain.
[profile.dev.package."*"]
opt-level = 2

# The inflater optimised in test builds too: the bundle tests decompress megabytes many times over (round E3e).
[profile.dev.package.zlib-rs]
opt-level = 3
