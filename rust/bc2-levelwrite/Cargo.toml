[package]
name = "bc2-levelwrite"
description = "The map editor's level writer and map project: the operation log and its edits on a level partition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# one test binary: tests/main.rs holds each file of tests/ as a module (round QW1)
autotests = false

[dependencies]
bc2-formats.workspace = true
thiserror.workspace = true
# culltree.py's model (culltool, round O3): its exceptions and value texts; the reference levels read on all cores
bc2-pyrt.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
# the base partition's sha1 (navtune.json's base check)
sha1_smol.workspace = true
# the new level's pictures (round E3b): the texture writer and reader, the user's PNG / JPEG pictures
bc2-convert.workspace = true
png.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
# round A1: the site (ground, water, collision) of the auto layout and the placement rules; the proofs load levels
bc2-scene.workspace = true

# mapexport.exe's application icon (round I1: build.rs)
[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[[test]]
name = "levelwrite"
path = "tests/main.rs"
