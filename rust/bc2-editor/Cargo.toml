[package]
name = "bc2-editor"
description = "The BFBC2 Tool Suite's map editor application: the window, the map view, editing a map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# one test binary: tests/main.rs holds each file of tests/ as a module (round QW1)
autotests = false

[[bin]]
name = "bfbc2-editor"
path = "src/main.rs"

[dependencies]
bc2-formats.workspace = true
bc2-tools.workspace = true
bc2-gamefs.workspace = true
bc2-scene.workspace = true
bc2-levelwrite.workspace = true
# the map export's install, in process (round OR6: the Install dialog; Project OPFOR's mapedit_install.py before)
bc2-install = { workspace = true, features = ["mapedit"] }
# the AI workspace's navigation data (round GR2): NavKit's cell sampling, the path test's A*, the side file's text;
# Build with these edits in process (round NK6: the level driver, inputs / apply, with graphedit)
bc2-navbuild = { workspace = true, features = ["graphedit"] }
# the side file's base and the traversal annotations' file check (round GR2)
sha1_smol.workspace = true
# the game-accurate view (round R5)
bc2-render.workspace = true
# the PC texture decoder (the start screen's pictures read from the game copy: catalog.rs); the asset preview's mesh
# index and its cache (round GR3; the cache bc2_gamefs::meshindex's own format since round PR1b-2-rest)
bc2-convert.workspace = true
eframe.workspace = true
egui_dock.workspace = true
serde.workspace = true
# the editor's errors by kind (round OP1)
thiserror.workspace = true
serde_json.workspace = true
bytemuck.workspace = true
pollster.workspace = true
png.workspace = true

# the game-accurate view's shared frame opened on egui's device (the NT handle's type)
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# the application icon (round I1: build.rs)
[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# the recorded Map Inspector lists are gzip JSON (tests/data)
flate2.workspace = true
# the recorded property trees are digests (tests/data/inspector_props_*)
sha1_smol.workspace = true

[lints]
workspace = true

[[test]]
name = "editor"
path = "tests/main.rs"
