[package]
name = "bc2-py"
description = "Python bindings (module bc2_native) for the BFBC2 Tool Suite's Rust core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "bc2_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
bc2-formats.workspace = true
bc2-tools.workspace = true
bc2-gamefs.workspace = true
bc2-scene.workspace = true
bc2-convert.workspace = true
bc2-xma.workspace = true
# navkit.py's apply edits (navapply.rs) are bc2-navbuild's graphedit feature
bc2-navbuild = { workspace = true, features = ["graphedit"] }
bc2-shader.workspace = true
bc2-stockmp.workspace = true
bc2-harness.workspace = true
# round OR5: the menu art's picture pieces (bc2_menu::modeart / pil) for OPFOR's Pacific War menu step
bc2-menu.workspace = true
# round F4: xenos.disasm's header formats floats as Python's %g does
bc2-pyrt.workspace = true
iced-x86.workspace = true
pyo3.workspace = true
# ShaderMerger's arena and the value that holds it with the merger (round OR3a)
bumpalo.workspace = true
self_cell.workspace = true
rayon.workspace = true
# OPFOR's WW2 level build (round OR2): its bindings arrive as JSON
bc2-install = { workspace = true, features = ["levelbuild", "onslaught", "rebuild"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
