[package]
name = "bc2-render"
description = "The map editor's game-accurate view (round R5): a level's meshes and terrain drawn with DICE's own compiled Direct3D 11 shaders, as BFBC2's Dx11 renderer draws them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# one test binary: tests/main.rs holds each file of tests/ as a module (round QW1)
autotests = false

[dependencies]
bc2-formats.workspace = true
# the tonemap over a frame's pixels
rayon.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# the parity test reads the C++ harness's (renderqa / shaderview) picture
png.workspace = true
# the examples and level tests place a level's objects and group members as the editor does
bc2-scene.workspace = true

[lints]
workspace = true

[[test]]
name = "render"
path = "tests/main.rs"
