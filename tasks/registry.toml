[[category]]
id = "formats"
name = "Formats and conversion"
definition = "File-format readers and writers (DBX, FbRB, mesh, Havok, Granny, textures, sound) and the converters that port content between platforms and games."

[[category]]
id = "shaders"
name = "Shaders and rendering"
definition = "Shader databases, the Xenos shader translator, render QA, the game-accurate view, lighting, weather and RenderDoc work."

[[category]]
id = "editor"
name = "Levels and map editor"
definition = "The map editor's shell, views, gameplay tools, validation and export, and level building / installing."

[[category]]
id = "terrain"
name = "Terrain and vegetation"
definition = "Terrain sculpt and paint, the terrain generator, sub-terrain rings, strips and patches, vegetation and roads."

[[category]]
id = "navai"
name = "NavKit and AI"
definition = "Path data, Kynapse / NavKit parity, the bot AI specification, bots, the stock-MP AI layer and vehicle AI."

[[category]]
id = "host"
name = "Engine host and patching"
definition = "The DLL / in-process host, hooks, patches, guards and probes, the network guard, crashes and the launcher."

[[category]]
id = "menus"
name = "Menus and UI"
definition = "APT menus and their tools, HUD, the hub, Gunrack, list screens, Live and sign-in removal."

[[category]]
id = "input"
name = "Input and controllers"
definition = "Controllers, aim assist, button prompts, keyboard / mouse, per-era input schemes."

[[category]]
id = "eras"
name = "Eras and game modes"
definition = "Native eras, game modes and their data sets, Vietnam offline, per-era gameplay data."

[[category]]
id = "persistence"
name = "Persistence, progression and awards"
definition = "Profiles, stats, unlocks, careers, awards, achievements and saves."

[[category]]
id = "pacific"
name = "Pacific War (WW2) content"
definition = "BF1943 content in BFBC2: maps, weapons, vehicles, kits, air raid, and the WW2 rebuild."

[[category]]
id = "onslaught"
name = "Onslaught / console port"
definition = "BFBC2's console-only content (Onslaught maps, the Mark V) ported to PC, and the community mod's maps."

[[category]]
id = "bfbc1"
name = "BFBC1 port"
definition = "Battlefield: Bad Company (Xbox 360) analysis, specification, upgraders and the port into the BFBC2 engine."

[[category]]
id = "bf1943-native"
name = "BF1943 native client (retired)"
definition = "The retired native BF1943 PC client and its research workspace: decompilation milestones, rsnav / rsbot, Xenia runs."

[[category]]
id = "tooling"
name = "Tooling, CI and the Rust port"
definition = "The Rust core and command lines, Python retirement and the Python exit, tests, CI, caches, disk and speed."

[[category]]
id = "repos"
name = "Repos, architecture and data"
definition = "Repository splits and migrations (xenolith, bfo), the data root, clean-ups, audits of structure and junk."

[[category]]
id = "docs"
name = "Docs and spec"
definition = "The engine specification, knowledge base, READMEs and documentation rounds."

[[category]]
id = "re"
name = "Reverse engineering"
definition = "Decompiled database, static research rounds, recompilation and third-party oracles."

[[category]]
id = "release"
name = "Release and licensing"
definition = "Release packaging, installers, licences and credits, licensing rulings and naming before release."

