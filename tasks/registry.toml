[[task]]
id = "rd1"
code = "RD1"
title = "Road and track drawing tool"
lane = "later"
repos = ["suite"]
category = "terrain"
raised = "2026-11-23"
score = { d = 3, t = 3, h = 4.8 }
body = "End of the queue, after E5-rest; Catmull-Rom / Bezier, baked to the road blocks."
scope = "end of the queue (the user, 2026-11-23); after E5-rest, whose paint and sculpt layers it uses: a road / track drawing tool in the map editor for asphalt, dirt, gravel and tyre-track roads. **Drawing:** straight segments (a polyline with optional corner rounding at a set radius), Catmull-Rom splines through the clicked points (centripetal by default; uniform and chordal as options), and cubic Bezier - any Catmull-Rom or polyline road converts exactly to Bezier segments with editable handles (uniform: P1 + (P2 - P0) / 6 and P2 - (P3 - P1) / 6; the centripetal / chordal forms from each segment's own parameter spacing); Bezier back to Catmull-Rom only while the handles still match; the kinds mix along one road with continuous joins. The project keeps the curve (points, kind, handles), never only the bake. **Bake:** strips sampled by arc length (density independent of the drawing), conformed to the ground, written to both road blocks of the visual terrain (DECAL-STRIP-1, TERR-VT-2) with a donor road strip's shader entries of the strip vertex layout (DECAL-STRIP-2), a width, a road type from DICE's own road strips in the content set, and a layer 0 - 7 for overlaps. **Ground:** optional flatten / smooth along the road through E5's sculpt layer, the matching physics material painted under it (E5's material map), undergrowth cleared by the mask (VEG-UG-5), the road reaching NavKit's road cost (BOT-MOV-4: RoadCostModifier 0.5). **Edits:** re-bake on every sculpt, undo / redo and point move (DECAL-STRIP-3: nothing re-bakes in game). **Export:** the terrain bundle, read back by a new XVAL rule. **Proof:** Catmull-Rom and its Bezier conversion agree point for point and round-trip unchanged; arc-length sampling stable in the point count; DICE's own roads re-baked from splines fitted to their strips and compared with DICE's strips; the look in game once in-game tests resume"
source = "TR0; ROADMAP Queued RD1"

